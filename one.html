<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRREVERSIBLE: The Lasting Effects of War</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-panel: #0b0e17;
      --bg-panel-subtle: #121724;
      --border-subtle: #242c3d;
      --border-accent: #3a455c;
      
      --ukraine-blue: #0057B7;
      --ukraine-yellow: #FFD700;
      
      --war-crimson: #a31824;
      --war-crimson-bright: #e63946;
      --war-amber: #e07a5f;
      
      --text-primary: #f0f3f8;
      --text-secondary: #9aa5b8;
      --text-muted: #5e6b82;
      
      --font-display: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow-x: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Interactive Background Canvas (Cracks) */
    #crack-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* Dynamic Atmospheric Overlay */
    #war-atmosphere {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
      opacity: 0.15;
      transition: opacity 0.5s ease;
      background: radial-gradient(circle at 50% 50%, rgba(163, 24, 36, 0.4) 0%, rgba(0, 0, 0, 0.9) 100%);
    }

    /* Top HUD / Navigation */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: rgba(6, 8, 13, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 100;
    }

    .brand-dossier {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .flag-strip {
      display: flex;
      flex-direction: column;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .flag-strip span:first-child { background: var(--ukraine-blue); height: 50%; }
    .flag-strip span:last-child { background: var(--ukraine-yellow); height: 50%; }

    .brand-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
    }

    nav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--ukraine-yellow);
    }

    .audio-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-accent);
      color: var(--text-primary);
      padding: 0.35rem 0.8rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .audio-toggle-btn.active {
      border-color: var(--war-crimson-bright);
      background: rgba(163, 24, 36, 0.2);
    }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
      background: radial-gradient(circle at 50% 30%, rgba(0, 87, 183, 0.12) 0%, rgba(6, 8, 13, 1) 70%);
      z-index: 15;
    }

    .hero-pre-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.3rem 0.9rem;
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: var(--ukraine-yellow);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      color: #fff;
      text-shadow: 0 0 30px rgba(0, 87, 183, 0.4);
    }

    .hero-subtitle {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 2.5vw, 1.8rem);
      color: var(--text-secondary);
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      font-weight: 400;
    }

    .hero-strip {
      display: flex;
      gap: 1.2rem;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--war-crimson-bright);
      margin-bottom: 2rem;
      letter-spacing: 0.12em;
    }

    .hero-desc {
      max-width: 680px;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.8;
      margin-bottom: 3rem;
    }

    .scroll-hint {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    /* Main Container & Act Scaffolding */
    main {
      position: relative;
      z-index: 15;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 6rem;
    }

    .act-section {
      min-height: 100vh;
      padding: 6rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .act-header {
      margin-bottom: 3rem;
    }

    .act-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--ukraine-yellow);
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }

    .act-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .act-desc {
      color: var(--text-secondary);
      max-width: 760px;
      font-size: 1rem;
      line-height: 1.7;
    }

    /* Act 1 Grid & Collapse Simulator */
    .collapse-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 3rem;
      align-items: start;
    }

    .metric-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .metric-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 1.2rem;
      border-left: 3px solid var(--ukraine-yellow);
    }

    .metric-card .label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.4rem;
    }

    .metric-card .val {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .metric-card .sub {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
      display: block;
    }

    .sim-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 1.5rem;
    }

    .sim-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .canvas-box {
      position: relative;
      width: 100%;
      height: 380px;
      background: #040508;
      border: 1px solid var(--border-accent);
      cursor: crosshair;
    }

    #building-canvas {
      width: 100%;
      height: 100%;
    }

    .sim-controls {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .sim-btn {
      background: var(--bg-panel-subtle);
      border: 1px solid var(--border-accent);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sim-btn:hover {
      border-color: var(--ukraine-yellow);
      background: rgba(255, 215, 0, 0.1);
    }

    /* Act 2 Displacement Map */
    .displacement-box {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .map-canvas-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #04060a;
      border: 1px solid var(--border-accent);
    }

    #map-canvas {
      width: 100%;
      height: 100%;
    }

    .cohort-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .cohort-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 1.5rem;
    }

    .cohort-card.active {
      border-color: var(--war-crimson-bright);
    }

    .cohort-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--ukraine-yellow);
      margin-bottom: 0.5rem;
      display: block;
    }

    .cohort-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin-bottom: 0.8rem;
    }

    .cohort-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 1rem;
    }
